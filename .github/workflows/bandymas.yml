name: Svetainių prieinamumo bandymas
# Tik ranka. Mandagus patikrinimas (robots.txt, tikras roboto vardas), nieko nesaugo.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bandymas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LUMINOR_PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
      LUMINOR_PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
      LUMINOR_PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -u bandymas.py
