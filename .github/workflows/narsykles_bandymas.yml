name: Naršyklės bandymas

# Vienkartinis: ar Skelbiu.lt per proxy atsidaro tikroje naršyklėje. Paleidžiama tik ranka.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bandymas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LUMINOR_PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
      LUMINOR_PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
      LUMINOR_PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: xvfb-run -a python -u narsykles_bandymas.py
      - name: Išsaugoti
        if: always()
        run: |
          git config user.name "skelbimu-robotas"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Naršyklės bandymas"
          git pull --rebase -q origin main || true
          git push
