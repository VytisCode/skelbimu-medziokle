name: ES nuolaidos ir LT kainos

# Kasdien surenka karščiausias naujų daiktų akcijas iš ES nuolaidų bendruomenių (RSS) per LT proxy.
# Ranka (arba Claude užduotis) gali paleisti LT kainų patikrą: įvesti užklausas, atskirtas „;“.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      lt:
        description: "LT kainų užklausos, atskirtos ;  (tuščia = tik akcijos)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nuolaidos
  cancel-in-progress: false

jobs:
  nuolaidos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LUMINOR_PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
      LUMINOR_PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
      LUMINOR_PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
      LT_UZKLAUSOS: ${{ github.event.inputs.lt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ES akcijos
        if: env.LT_UZKLAUSOS == ''
        run: python -u nuolaidos.py feed
      - name: LT kainos
        if: env.LT_UZKLAUSOS != ''
        run: |
          IFS=';' read -ra Q <<< "$LT_UZKLAUSOS"
          python -u nuolaidos.py lt "${Q[@]}"
      - name: Išsaugoti
        run: |
          git config user.name "skelbimu-robotas"
          git config user.email "actions@users.noreply.github.com"
          for f in data/nuolaidos.json data/lt_kainos.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "Nuolaidos $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push
